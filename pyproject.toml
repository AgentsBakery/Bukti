[project]
name = "bukti"
version = "0.1.0"
description = "Evidence-based credit for informal micro-businesses, built on Gemini and ADK"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk==2.12.0",
    "google-genai>=2.31.0",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-bigquery>=3.46.2",
    "google-cloud-storage>=3.17.1",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart>=0.0.20",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.uv]
package = false
