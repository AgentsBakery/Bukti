sonar.projectKey=bukti
sonar.projectName=Bukti
sonar.sources=app,agents,web/src
sonar.tests=tests
sonar.exclusions=web/public/**,web/dist/**,data/**,eval/results/**
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
# Backend coverage comes from pytest-cov in CI. The React app has no unit tests yet (it is type-checked, linted and
# built in CI), so it is left out of the coverage metric; it is still analysed for bugs, smells and security issues.
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=web/**
